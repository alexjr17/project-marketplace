services:
  # Base de datos MariaDB
  db:
    image: mariadb:10.11
    container_name: vexa-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marketplace
      MYSQL_USER: marketplace
      MYSQL_PASSWORD: marketplace123
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Laravel
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: vexa-api
    restart: unless-stopped
    environment:
      # Workers para que el servidor atienda peticiones concurrentes.
      PHP_CLI_SERVER_WORKERS: 10
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      # vendor vive en un volumen propio de Docker (no en el bind-mount lento de Windows).
      - api_vendor:/app/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marketplace-network

  # Frontend React
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vexa-frontend
    restart: unless-stopped
    environment:
      # El frontend apunta directamente a la API de Laravel.
      VITE_API_URL: http://localhost:8000/api
      # Polling para hot reload en Windows/Docker
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5174"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    depends_on:
      - api
    networks:
      - marketplace-network

volumes:
  mariadb_data:
  api_vendor:

networks:
  marketplace-network:
    driver: bridge
