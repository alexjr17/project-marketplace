services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marketplace
      MYSQL_USER: marketplace
      MYSQL_PASSWORD: marketplace123
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-init:
    image: project-marketplace-api-dev
    build:
      context: ./project-marketplace-api
      dockerfile: Dockerfile.dev
    restart: "no"
    environment: &api-environment
      PHP_CLI_SERVER_WORKERS: 10
      PHP_INI_SCAN_DIR: ":/app/docker/php"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: marketplace
      DB_USERNAME: marketplace
      DB_PASSWORD: marketplace123
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    command:
      - sh
      - -c
      - >-
        if [ ! -f .env ]; then cp .env.example .env; fi;
        if ! grep -Eq '^APP_KEY=base64:.+' .env; then php artisan key:generate --force; fi;
        php artisan package:discover --ansi
    volumes: &api-volumes
      - ./project-marketplace-api:/app
      - api_vendor:/app/vendor
    networks:
      - marketplace-network

  migrate:
    image: project-marketplace-api-dev
    build:
      context: ./project-marketplace-api
      dockerfile: Dockerfile.dev
    restart: "no"
    environment: *api-environment
    command: ["php", "artisan", "migrate", "--force"]
    volumes: *api-volumes
    depends_on:
      api-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - marketplace-network

  api:
    image: project-marketplace-api-dev
    build:
      context: ./project-marketplace-api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment: *api-environment
    ports:
      - "8000:8000"
    volumes: *api-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - marketplace-network

  scheduler:
    image: project-marketplace-api-dev
    build:
      context: ./project-marketplace-api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *api-environment
    volumes: *api-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - marketplace-network

  frontend:
    build:
      context: ./project-marketplace-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5174"
    volumes:
      - ./project-marketplace-web/src:/app/src
      - ./project-marketplace-web/public:/app/public
      - ./project-marketplace-web/vite.config.ts:/app/vite.config.ts
      - ./project-marketplace-web/tailwind.config.js:/app/tailwind.config.js
      - ./project-marketplace-web/postcss.config.js:/app/postcss.config.js
      - ./project-marketplace-web/index.html:/app/index.html
      - /app/node_modules
    depends_on:
      - api
    networks:
      - marketplace-network

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf 'version: "2"\nweb_addr: 0.0.0.0:4040\nlog: stdout\nlog_format: logfmt\nlog_level: info\n' > /tmp/ngrok.yml;
        if [ -n "$$NGROK_AUTHTOKEN" ]; then
          if [ -n "$$NGROK_DOMAIN" ]; then
            exec ngrok --config=/tmp/ngrok.yml http --url=$$NGROK_DOMAIN api:8000;
          else
            exec ngrok --config=/tmp/ngrok.yml http api:8000;
          fi;
        else
          echo 'Configura NGROK_AUTHTOKEN en .env para iniciar el túnel.';
          exit 1;
        fi
    ports:
      - "4040:4040"
    depends_on:
      - api
    networks:
      - marketplace-network

volumes:
  mariadb_data:
  api_vendor:

networks:
  marketplace-network:
    driver: bridge
